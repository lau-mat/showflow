events { worker_connections 1024; }

http {
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Credential endpoints: brute force and signup spam protection without any app code.
    limit_req_zone $binary_remote_addr zone=auth_credentials:10m rate=10r/m;

    upstream backend_cluster {
        zone backend_cluster 64k;
        server backend:8080 resolve;
        # Enable alongside the optional second backend in docker-compose.yml.
        # server backend-2:8080 resolve;
    }

    upstream webapp_static {
        zone webapp_static 64k;
        server webapp:80 resolve;
    }

    server {
        listen 80;

        # Inherited by every location below (none of them sets its own).
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Required WebSocket proxy settings for future scaling
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # One origin for the web app and its API. The browser refresh cookie is scoped to
        # /api/auth and SameSite=Strict, so the API has to live next to the pages.
        location ~ ^/api/auth/(login|register)$ {
            limit_req zone=auth_credentials burst=10 nodelay;
            limit_req_status 429;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://backend_cluster;
        }

        # Server-sent events: held open for up to the access token's lifetime (15 minutes), so
        # nginx must neither buffer nor time out the response.
        location = /api/sync/stream {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://backend_cluster;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
        }

        location /api/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://backend_cluster;
        }

        location / {
            proxy_pass http://webapp_static;
        }
    }
}
