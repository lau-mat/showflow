services:
  postgres:
    image: postgres:16-alpine
    container_name: showflow_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: showflow_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: showflow_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: showflow_backend
    environment:
      - DATABASE_URL=postgres://postgres:secretpassword@postgres:5432/showflow_db
      - REDIS_URL=redis://redis:6379
      - RUST_LOG=debug
      - AUTH_JWT_SECRET=${AUTH_JWT_SECRET:?Set AUTH_JWT_SECRET to a random secret of at least 32 bytes}
      # Optional: signs caller passes (account-based show caller access). 32 random bytes in
      # base64 (`openssl rand -base64 32`); unset switches the feature off. Keep it stable.
      - CALLER_PASS_KEY=${CALLER_PASS_KEY:-}
      # Plain-http local gateway: browsers drop Secure cookies there. Remove behind https.
      - AUTH_COOKIE_INSECURE=1
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  # backend-2:
  #   build:
  #     context: .
  #     dockerfile: backend/Dockerfile
  #   container_name: showflow_backend_2
  #   environment:
  #     - DATABASE_URL=postgres://postgres:secretpassword@postgres:5432/showflow_db
  #     - REDIS_URL=redis://redis:6379
  #     - RUST_LOG=debug
  #     - AUTH_JWT_SECRET=${AUTH_JWT_SECRET}
  #   depends_on:
  #     - postgres
  #     - redis
  #   restart: unless-stopped

  loadbalancer:
    image: nginx:alpine
    container_name: showflow_nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - webapp
      # - backend-2
    restart: unless-stopped

  webapp:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: showflow_webapp
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  pgdata: