[package]
name = "protocol"
version = "0.1.0"
edition = "2021"

[dependencies]
# Caller passes (`caller_pass`): signed by the cloud, checked offline by a session host.
base64 = "0.22"
ed25519-dalek = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
