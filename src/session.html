<html>
    <head>
        <meta charset="UTF-8">
        <title>Showfow Client</title>
        <link rel="stylesheet" href="style/session.css">
        <link rel="stylesheet" href="style/boxes.css">
    </head>
    <body>

    <!-- Header Bar -->
    <header>
        <div class="show-title-group">
            <h1 id="ShowName"></h1>
        </div>
        <div id="actionBtnContainer"></div>
    </header>

    <main>
        <!-- Left Workspace: Active Notes + Full Cue List -->
        <section class="show-overview-section">
            
            <!-- CURRENT & NEXT CUE NOTES BANNER -->
            <div class="cue-notes-panel" aria-live="polite">
                <div class="note-card active">
                    <div class="note-header active">
                        <span>Current Cue Notes</span>
                        <span class="note-cue-number" id="currentCueNumber">—</span>
                    </div>
                    <div class="note-title" id="currentCueTitle">Waiting for cue data...</div>
                    <div class="note-body" id="currentCueNotes"></div>
                </div>

                <div class="note-card next">
                    <div class="note-header next">
                        <span>Next Cue Notes</span>
                        <span class="note-cue-number" id="nextCueNumber">—</span>
                    </div>
                    <div class="note-title" id="nextCueTitle">Waiting for cue data...</div>
                    <div class="note-body" id="nextCueNotes"></div>
                </div>
            </div>

            <!-- FULL CUE LIST -->
            <div class="section-header">
                <h2>Full Script Sequence</h2>
                <span id="itemCounter" style="color: var(--text-secondary); font-size: 0.8rem;"></span>
            </div>
            <div id="cueList" class="cue-list"></div>
        </section>

        <!-- Right: Control Sidebar -->
        <aside class="sidebar">
            
            <!-- Controls Panel -->
            <div class="panel">
                <h3>Session Controls</h3>
                <div class="control-grid">
                    <button id="btnNextCue" class="btn btn-success">NEXT CUE ▶</button>
                    <button id="previousCue" class="btn">◀ PREV</button>
                    <button class="btn">PAUSE</button>
                    <button class="btn btn-danger">END SESSION</button>
                </div>
            </div>

            <!-- Connected Roles Panel -->
            <div class="panel">
                <h3>Session overview</h3>
                <div id="role-list"></div>
            </div>

        </aside>
    </main>

    <script src="js/dynamic_generator.js"></script>
    <script src="js/session.js"></script>
    </body>
</html>
