<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="style/styles.css" />
    <link rel="stylesheet" href="style/boxes.css" />
    <link rel="stylesheet" href="style/print.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShowFlow</title>
  </head>

  <body>
    <!-- Header absolute position preserves perfect main table centering -->
    <header class="app-header">
      <h1 class="brand-title">Show<span class="brand-accent">Flow</span></h1>
    </header>

    <main>
      <div id="sessionDiscovery">
        <table id="discoveredSessions">
          <thead>
            <tr>
              <th>Session Name</th>
              <th>Session ID</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="discoveredSessionsTableBody">
            <tr>
              <td style="text-align: center;" colspan="3">No sessions discovered yet.</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div id="editShows">
        <table id="editShowsTable">
          <thead>
            <tr>
              <th>Session Name</th>
              <th>Start Time</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="editShowsTableBody"></tbody>
          <tfoot>
            <tr>
              <td colspan="3" class="create-show-cell">
                <button id="createShowBtn" type="button">
                  <span class="plus-icon">+</span> Create New Show
                </button>
              </td>
            </tr>
          </tfoot>
        </table>
      </div>
    </main>
    <script src="/js/dynamic_generator.js" defer></script>
    <script src="/js/pages/edit_show.page.js" defer></script>
    <script type="module" src="/js/main.js" defer></script>
  </body>
</html>
